<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Vijay Kumar Yadav</title>
  <meta name="author" content="Vijay Kumar Yadav">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css?v=8">
  <script>
    /* Apply the saved theme before first paint (no flash). Light is default. */
    try { var t = localStorage.getItem('vijay267-theme'); if (t === 'dark' || t === 'light') { document.documentElement.setAttribute('data-theme', t); } else { var h = new Date().getHours(); document.documentElement.setAttribute('data-theme', (h >= 18 || h < 5) ? 'dark' : 'light'); } var w = localStorage.getItem('vijay267-weather'); if (w) document.documentElement.setAttribute('data-weather', w); }
    catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  </script>
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div id="scroll-progress" aria-hidden="true"><div></div></div>
  <main>
    <div class="notfound">
      <div>
        <h1>404</h1>
        <h2>Page not found</h2>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="index.html">Go home</a>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
